name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore CodeWF.Tools.slnx --force-evaluate

      - name: Build
        run: dotnet build CodeWF.Tools.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeWF.Tools.slnx --configuration Release --no-build --no-restore --verbosity normal
